apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: chat-app
data:
  kong.yml: |
    _format_version: "2.1"
    services:
      - name: user-service
        url: http://user-service.chat-app.svc.cluster.local:8080
        routes:
          - name: user-route
            # regex path, matches /api/anything
            paths:
              - "/api/helloworld"
            strip_path: false
            methods:
              - GET
              - POST