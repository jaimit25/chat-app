apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: chat-app  
spec:
  type: LoadBalancer
  selector:
    app: kong
  ports:
    - name: proxy-http
      port: 8000
      targetPort: 8000
    - name: proxy-https
      port: 8443
      targetPort: 8443
    - name: admin-http
      port: 8001
      targetPort: 8001
    - name: admin-https
      port: 8444
      targetPort: 8444
